server:
  port: 8082

spring:
  application:
    name: analysis-service
  datasource:
    url: jdbc:h2:file:./data/analysis-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 200
      hibernate.order_inserts: true
  h2:
    console:
      enabled: true
      path: /h2-console
  main:
    web-application-type: servlet

codelens:
  analysis:
    source-service-url: ${SOURCE_SERVICE_URL:http://localhost:8081}
    external-rules-directory: ${CODELENS_RULES_DIR:}
    max-files-per-analysis: 5000
    max-findings-per-rule-per-file: 20
    long-file-threshold: 400
    complexity-threshold: 15
    duplication-window-lines: 6
    secret-entropy-threshold: 4.0
    secret-min-length: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.codelens: DEBUG
