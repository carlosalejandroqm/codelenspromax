server:
  port: 8083

spring:
  application:
    name: report-service
  datasource:
    url: jdbc:h2:file:./data/report-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  main:
    web-application-type: servlet

codelens:
  report:
    analysis-service-url: ${ANALYSIS_SERVICE_URL:http://localhost:8082}
    max-recommendations: 25
    examples-per-recommendation: 3
    min-confidence: 0.35
    external-playbooks-directory: ${CODELENS_PLAYBOOKS_DIR:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.codelens: DEBUG
